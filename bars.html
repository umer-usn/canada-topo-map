<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&display=swap">
<style>
  /* Layout: one black stage; Canada is a field of extruded bars, seen from the south, and turns on its vertical axis. */
  :root {
    --bg: #000000;
    --bar-far: #1f2428;
    --bar-near: #d6dbe0;
    --bar-lit: #f1f4f6;
    --accent: #ff5900;
    --tip-bg: rgba(0, 0, 0, 0.2);
    --tip-fg: #ffffff;
    --tip-edge: rgba(255, 255, 255, 0.16);
    --ctl-edge: rgba(255, 255, 255, 0.16);
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    font-family: var(--font-body);
    padding-block: 1rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stage {
    position: relative;
    width: min(100%, max(320px, min(1400px, calc((100vh - 2rem) * 1.6))));
    aspect-ratio: 1.6 / 1;
    background: var(--bg);
  }
  @media (max-width: 600px) { .stage { aspect-ratio: 1.25 / 1; } }
  canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; outline: none; user-select: none; -webkit-user-select: none; }
  canvas:focus-visible { outline: 1px solid var(--ctl-edge); outline-offset: -1px; }
  canvas.over { cursor: pointer; }
  canvas.dragging { cursor: grabbing; }

  .tip {
    position: absolute;
    left: 0; top: 0;
    pointer-events: none;
    background: var(--tip-bg);
    -webkit-backdrop-filter: blur(10px) saturate(1.3);
    backdrop-filter: blur(10px) saturate(1.3);
    border: 1px solid var(--tip-edge);
    color: var(--tip-fg);
    font-size: 0.8125rem;
    font-weight: 500;
    line-height: 1;
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    white-space: nowrap;
  }

  /* Standalone: fill the window (or the Figma embed) and centre the map. */
  html, body { margin: 0; height: 100%; }
  body { padding: 0; justify-content: center; }
  .stage { width: min(100%, calc(100vh * 1.6)); width: min(100%, calc(100dvh * 1.6)); }
  @media (max-width: 600px) { .stage { width: min(100%, calc(100vh * 1.25)); width: min(100%, calc(100dvh * 1.25)); } }
</style>
</head>

      for (let w = 0; w < 2; w++) {
        if (SIDE[i * 2 + w] < 0) continue;
        poly(o + 8 + w * 8, face(i, sideLv, SIDE_I[i * 2 + w], now));
      }
      let top = face(i, sideLv, TOP_I, now);
      if (mk) {
        // the marker's cap glows brighter than the orange around it and breathes with the pulse
        const ph = reduceMotion ? 0.3 : (now / 2200 + (i === marks[1] ? 0.5 : 0)) % 1, br = 1.08 + 0.1 * Math.sin(ph * TAU);
        top = 'rgb(' + [accentRgb[0] * br + 40, accentRgb[1] * br + 46, accentRgb[2] * br + 40].map(v => Math.round(Math.min(255, v * TOP_I / 0.94))).join(',') + ')';
      }
      poly(o, top);
    }
    drawBeacons(now);
  }

  // Rings spread across the cap of each marker and fade out, so the two orange pillars read as live.
  function project(X, Y, Z) { const z = CAM_D - Y * sinT + Z * cosT; return [OX + X / z * S, OY - (Y * cosT + Z * sinT) / z * S]; }
  function drawBeacons(now) {
    ctx.fillStyle = accentCss;
    ctx.strokeStyle = accentCss;
    marks.forEach((i, m) => {
      const lv = level[prov[i]], phase = reduceMotion ? 0.3 : (now / 2200 + m * 0.5) % 1;
      const H = HT[i], c0 = project(RX[i], H, RZ[i]);
      const rx = HW * S / (CAM_D - H * sinT + RZ[i] * cosT);
      ctx.globalAlpha = 0.2 + lv * 0.12;
      ctx.beginPath(); ctx.arc(c0[0], c0[1] - rx * 0.4, rx * 2.8, 0, TAU); ctx.fill();
      for (let r = 0; r < 2; r++) {
        const ph = (phase + r * 0.5) % 1, R = HW * (1.1 + ph * 4.6);
        ctx.globalAlpha = 0.95 * Math.pow(1 - ph, 1.4);
        ctx.lineWidth = Math.max(1.5, rx * 0.34);
        ctx.beginPath();
        for (let k = 0; k <= 48; k++) {
          const a = k / 48 * TAU, p = project(RX[i] + Math.cos(a) * R, H, RZ[i] + Math.sin(a) * R);
          if (k) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]);
        }
        ctx.stroke();
      }
    });
    ctx.globalAlpha = 1; ctx.lineWidth = 0.6;
  }

  // One frame loop drives the rotation (drag momentum, keys, idle spin), the province glow and the pulse.
  function loop(now) {
    let turned = dirty;
    dirty = false;
    const dt = lastT ? Math.min(now - lastT, 50) : 0;
    lastT = now;
    if (!dragging && Math.abs(spin) > 0.0004) { yaw += spin; spin *= 0.94; turned = true; }
    else if (!dragging) spin = 0;
    if (idleSpin && !overCanvas && !dragging) { yaw += AUTO * dt / 1000; turned = true; }   // stops while the mouse is on the map
    if (turned) {
      updateView();
      if (lastEvent && lastEvent.pointerType === 'mouse' && !dragging) hover(lastEvent);   // the map moved under the cursor
    }
    for (let p = 0; p < level.length; p++) {
      if (level[p] === fadeGoal[p]) continue;
      const u = Math.min(1, (performance.now() - fadeT0[p]) / (fadeGoal[p] > fadeFrom[p] ? FADE_IN : FADE_OUT));
      level[p] = u >= 1 ? fadeGoal[p] : fadeFrom[p] + (fadeGoal[p] - fadeFrom[p]) * ease(u);
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  // Point inside a convex quad, grown slightly about its centre so the thin gaps between bars don't drop the hover.
  function inQuad(o, x, y, grow) {
    const cx = (Q[o] + Q[o + 2] + Q[o + 4] + Q[o + 6]) / 4, cy = (Q[o + 1] + Q[o + 3] + Q[o + 5] + Q[o + 7]) / 4;
    let sign = 0;
    for (let k = 0; k < 4; k++) {
      const j = (k + 1) & 3;
      const ax = cx + (Q[o + k * 2] - cx) * grow, ay = cy + (Q[o + k * 2 + 1] - cy) * grow;
      const bx = cx + (Q[o + j * 2] - cx) * grow, by = cy + (Q[o + j * 2 + 1] - cy) * grow;
      const cr = (bx - ax) * (y - ay) - (by - ay) * (x - ax);
      if (cr === 0) continue;
      if (sign === 0) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return false;
    }
    return true;
  }
  function findBar(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    for (let n = N - 1; n >= 0; n--) {                       // nearest bar first
      const i = order[n], o = i * 24;
      if (inQuad(o, x, y, 1.18)) return i;
      for (let w = 0; w < 2; w++) if (SIDE[i * 2 + w] >= 0 && inQuad(o + 8 + w * 8, x, y, 1.18)) return i;
    }
    return -1;
  }

  function show(e, idx) {
    const p = prov[idx];
    if (p !== target) setTarget(p);
    if (!orange.has(p)) { tip.hidden = true; canvas.classList.remove('over'); return; }
    tip.textContent = names[p];
    tip.hidden = false;
    const rect = stage.getBoundingClientRect();
    let x = e.clientX - rect.left + 14, y = e.clientY - rect.top + 18;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > rect.width) x = e.clientX - rect.left - tw - 14;
    if (y + th > rect.height) y = e.clientY - rect.top - th - 14;
    tip.style.transform = 'translate(' + Math.max(0, x) + 'px,' + Math.max(0, y) + 'px)';
    canvas.classList.add('over');
  }
  function hide() {
    tip.hidden = true;
    canvas.classList.remove('over');
    if (target !== -1) setTarget(-1);
  }
  function hover(e) {
    const idx = findBar(e);
    if (idx < 0) hide(); else show(e, idx);
  }

  // ---- drag ----
  canvas.addEventListener('pointerdown', e => {
    lastEvent = e;
    dragging = true; moved = false; spin = 0;
    startX = lastX = e.clientX;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    hover(e);
  });
  canvas.addEventListener('pointermove', e => {
    lastEvent = e;
    if (e.pointerType === 'mouse') overCanvas = true;
    if (!dragging) { if (Math.abs(spin) < 0.0004) hover(e); return; }
    if (!moved && Math.abs(e.clientX - startX) > 4) {
      moved = true; hide(); canvas.classList.add('dragging');
    }
    if (moved) {
      const d = (e.clientX - lastX) * DRAG;
      yaw -= d; spin = -d; dirty = true;
    }
    lastX = e.clientX;
  });
  function release(e) {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') overCanvas = true; });
  canvas.addEventListener('pointerleave', e => {
    overCanvas = false;
    if (!dragging && e.pointerType !== 'touch') { lastEvent = null; hide(); }
  });

  // ---- horizontal scroll (trackpad swipe, tilt wheel, or Shift + wheel) ----
  canvas.addEventListener('wheel', e => {
    const unit = e.deltaMode === 1 ? 16 : 1;
    let dx = e.deltaX * unit;
    if (e.shiftKey && !dx) dx = e.deltaY * unit;
    if (!dx || (!e.shiftKey && Math.abs(e.deltaX) < Math.abs(e.deltaY))) return;   // vertical scroll stays with the page
    e.preventDefault();
    yaw += dx * WHEEL; dirty = true;
  }, { passive: false });

  // ---- keyboard ----
  canvas.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    spin += (e.key === 'ArrowLeft' ? -1 : 1) * -0.035;
  });

  readColors();
  new ResizeObserver(size).observe(stage);
  size();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
