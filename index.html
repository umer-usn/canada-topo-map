  :root {
    --bg: #000000;

    --dot-near: #d6dbe0;
    --dot-lit: #f1f4f6;

    --ctl-fg: #c9cfd4;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    font-family: var(--font-body);
    padding-block: 1rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stage {
    position: relative;
    width: min(100%, max(320px, min(1400px, calc((100vh - 2rem) * 1.6))));
    aspect-ratio: 1.6 / 1;
    background: var(--bg);
  }
  @media (max-width: 600px) { .stage { aspect-ratio: 1.25 / 1; } }
  canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; outline: none; user-select: none; -webkit-user-select: none; }
  canvas:focus-visible { outline: 1px solid var(--ctl-edge); outline-offset: -1px; }
  canvas.over { cursor: pointer; }
  canvas.dragging { cursor: grabbing; }
  canvas.pulse { position: absolute; inset: 0; pointer-events: none; cursor: auto; }

  .tip {
    position: absolute;
    left: 0; top: 0;
    pointer-events: none;
    background: var(--tip-bg);
    -webkit-backdrop-filter: blur(10px) saturate(1.3);
    backdrop-filter: blur(10px) saturate(1.3);
    border: 1px solid var(--tip-edge);
    color: var(--tip-fg);
    font-size: 0.8125rem;
    font-weight: 500;
    line-height: 1;
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    white-space: nowrap;
  }


  /* Standalone: fill the window (or the Figma embed) and centre the map. */
  html, body { margin: 0; height: 100%; }
  body { padding: 0; justify-content: center; }
  .stage { width: min(100%, calc(100vh * 1.6)); width: min(100%, calc(100dvh * 1.6)); }
  @media (max-width: 600px) { .stage { width: min(100%, calc(100vh * 1.25)); width: min(100%, calc(100dvh * 1.25)); } }
</style>

  function animate() { if (!raf) raf = requestAnimationFrame(loop); }

  function findDot(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    let best = -1, bd = 1;
    for (let i = 0; i < N; i++) {
      const rx = RRX[i], dx = (RSX[i] - x) / rx;
      if (dx > 1 || dx < -1) continue;
      const dy = (RSY[i] - y) / (rx * 0.6), d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function show(e, idx) {
    const p = dots[idx][2];
    if (p !== target) setTarget(p);
    if (!orange.has(p)) { tip.hidden = true; canvas.classList.remove('over'); return; }
    tip.textContent = names[p];
    tip.hidden = false;
    const rect = stage.getBoundingClientRect();
    let x = e.clientX - rect.left + 14, y = e.clientY - rect.top + 18;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > rect.width) x = e.clientX - rect.left - tw - 14;
    if (y + th > rect.height) y = e.clientY - rect.top - th - 14;
    tip.style.transform = 'translate(' + Math.max(0, x) + 'px,' + Math.max(0, y) + 'px)';
    canvas.classList.add('over');
  }
  function hide() {
    tip.hidden = true;
    canvas.classList.remove('over');
    if (target !== -1) setTarget(-1);
  }
  function hover(e) {
    const idx = findDot(e);
    if (idx < 0) hide(); else show(e, idx);
  }

  // ---- drag ----
  canvas.addEventListener('pointerdown', e => {
    lastEvent = e;
    dragging = true; moved = false; spin = 0;
    startX = lastX = e.clientX;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    hover(e);
  });
  canvas.addEventListener('pointermove', e => {
    lastEvent = e;
    if (e.pointerType === 'mouse') overCanvas = true;
    if (!dragging) { if (Math.abs(spin) < 0.0004) hover(e); return; }
    if (!moved && Math.abs(e.clientX - startX) > 4) {
      moved = true; hide(); canvas.classList.add('dragging');
    }
    if (moved) {
      const d = (e.clientX - lastX) * DRAG;
      yaw -= d; spin = -d; dirty = true;
      animate();
    }
    lastX = e.clientX;
  });
  function release(e) {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    animate();
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') overCanvas = true; });
  canvas.addEventListener('pointerleave', e => {
    overCanvas = false;
    if (!dragging && e.pointerType !== 'touch') { lastEvent = null; hide(); }
    animate();
  });

  // ---- horizontal scroll (trackpad swipe, tilt wheel, or Shift + wheel) ----
  canvas.addEventListener('wheel', e => {
    const unit = e.deltaMode === 1 ? 16 : 1;
    let dx = e.deltaX * unit;
    if (e.shiftKey && !dx) dx = e.deltaY * unit;
    if (!dx || (!e.shiftKey && Math.abs(e.deltaX) < Math.abs(e.deltaY))) return;   // vertical scroll stays with the page
    e.preventDefault();
    yaw += dx * WHEEL; dirty = true;
    animate();
  }, { passive: false });

  // ---- keyboard ----
  canvas.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    spin += (e.key === 'ArrowLeft' ? -1 : 1) * -0.035;
    animate();
  });

  readColors();
  new ResizeObserver(size).observe(stage);
  size();
  animate();
  requestAnimationFrame(pulseLoop);
})();
</script>
</body>
</html>
